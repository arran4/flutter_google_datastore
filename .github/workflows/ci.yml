# Canonical GitHub Actions CI/CD Super-Reference (043)
# https://arran4.github.io/blog/post/2026/043-canonical-github-actions-ci-cd-super-reference/
name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "build"
        type: choice
        options:
          - build
          - lint-fix
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - monthly-maintenance
          - publish-tag
      release_version_override:
        description: "Optional explicit release version, for example 2.4.0 or 2.4.0-rc.2"
        required: false
        default: ""
        type: string
      allow_prs:
        description: "Allow automation to open pull requests"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '17 3 1 * *'
    - cron: '41 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.inputs.mode, 'release-') }}

permissions:
  contents: read
  pull-requests: read

env:
  FLUTTER_SDK_VERSION: '3.44.4'

jobs:
  route:
    name: Route Event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_build: ${{ steps.route.outputs.run_build }}
      run_release: ${{ steps.route.outputs.run_release }}
      run_autofix: ${{ steps.route.outputs.run_autofix }}
      run_publisher: ${{ steps.route.outputs.run_publisher }}
      run_maintenance: ${{ steps.route.outputs.run_maintenance }}
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          run_code_checks=true
          run_build=true
          run_release=false
          run_autofix=false
          run_publisher=false
          run_maintenance=false
          mode="build"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # PRs just validate
            :
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "17 3 1 * *" ]]; then
               run_maintenance=true
               mode="monthly-maintenance"
            else
               run_autofix=true
               mode="lint-fix"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${INPUT_MODE:-build}"
            if [[ "$mode" == "lint-fix" ]]; then
               run_autofix=true
            elif [[ "$mode" == "publish-tag" ]]; then
               # The internal explicit publish-tag dispatch mode
               if [[ "$REF_TYPE" == "tag" && "$GITHUB_REF" == refs/tags/v* ]]; then
                  run_code_checks=false
                  run_build=true
                  run_publisher=true
               else
                  echo "Error: publish-tag mode requires a v* tag context. Found: $GITHUB_REF" >&2
                  sh -c "exit 1"
               fi
            elif [[ "$mode" == release-* ]]; then
               run_build=true
               run_release=true
            elif [[ "$mode" == "monthly-maintenance" ]]; then
               run_maintenance=true
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" && "$GITHUB_REF" == refs/tags/v* ]]; then
             # Standard external v* push publication
             run_publisher=true
          fi

          echo "run_code_checks=$run_code_checks" >> "$GITHUB_OUTPUT"
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "run_autofix=$run_autofix" >> "$GITHUB_OUTPUT"
          echo "run_publisher=$run_publisher" >> "$GITHUB_OUTPUT"
          echo "run_maintenance=$run_maintenance" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  policy-test:
    name: Test Release Policy
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install git-tag-inc
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - name: Test Policy Helper
        run: |
          # 1. Exact main vs wrong SHA
          echo "Testing verify_main_sha"
          # Valid
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          ./scripts/release_policy.sh verify_main_sha "main" "$MAIN_SHA"
          # Invalid branch
          ! ./scripts/release_policy.sh verify_main_sha "master" "$MAIN_SHA" || exit 1
          # Wrong SHA
          ! ./scripts/release_policy.sh verify_main_sha "main" "0000000000000000000000000000000000000000" || exit 1

          # 2. Tag calculation
          echo "Testing calculate_tag"
          TAG=$(./scripts/release_policy.sh calculate_tag "v1.2.3" "release-major")
          if [[ "$TAG" != "v1.2.3" ]]; then echo "Fail"; exit 1; fi
          # Test malformed override
          ! ./scripts/release_policy.sh calculate_tag "v1.x.y" "release-major" || exit 1
          # Test shell metacharacters
          ! ./scripts/release_policy.sh calculate_tag "v1.0.0; rm -rf /" "release-major" || exit 1

          # 3. Idempotency test using a dummy tag
          echo "Testing idempotent_push"
          git tag -a "v0.0.0-dummy" -m "test" "$MAIN_SHA" || true
          # Existing tag correct SHA - should pass
          ./scripts/release_policy.sh idempotent_push "v0.0.0-dummy" "$MAIN_SHA"
          # Existing tag WRONG SHA - should fail
          ! ./scripts/release_policy.sh idempotent_push "v0.0.0-dummy" "0000000000000000000000000000000000000000" || exit 1
          git tag -d "v0.0.0-dummy" || true

          echo "All policy tests passed!"

  flutter-analyze-test:
    name: Flutter Analyze & Test
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  release-validation:
    name: Release Quality Gates Passed
    needs: [route, flutter-analyze-test, policy-test]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - run: echo "All release quality gates passed."

  maintenance:
    name: Monthly Maintenance
    needs: [route]
    if: ${{ needs.route.outputs.run_maintenance == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - run: flutter pub upgrade --major-versions
      - name: Create Pull Request
        if: ${{ github.event_name == 'schedule' || inputs.allow_prs != false }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: monthly dependency update"
          title: "chore: monthly dependency update"
          branch: automation/maintenance
          delete-branch: true

  autofix:
    name: Autofix Formatting
    needs: [route]
    if: ${{ needs.route.outputs.run_autofix == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - run: flutter pub get
      - run: dart format .
      - name: Create Pull Request
        if: ${{ github.event_name == 'schedule' || inputs.allow_prs != false }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "style: auto-format code and lint fixes"
          title: "style: auto-format code and lint fixes"
          branch: automation/lint-fix
          delete-branch: true

  prepare-release-tag:
    name: Prepare Release Tag
    needs: [route, release-validation, windows, linux, macos]
    if: ${{ needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_tag: ${{ steps.tagger.outputs.TAG }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install git-tag-inc
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - name: Verify Exact Origin/Main
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/release_policy.sh verify_main_sha "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Calculate or explicitly set version
        id: tagger
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version_override }}
        run: |
          TAG=$(./scripts/release_policy.sh calculate_tag "$RELEASE_VERSION_OVERRIDE" "$RELEASE_MODE")
          echo "Calculated TAG=$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
      - name: Tag and push (Idempotent)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/release_policy.sh idempotent_push "$TAG" "$GITHUB_SHA"

  windows:
    name: Windows build
    runs-on: windows-latest
    needs: [route, release-validation]
    if: ${{ always() && needs.route.outputs.run_build == 'true' && (needs.release-validation.result == 'success' || needs.release-validation.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - name: Set up environment vars
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
             TAG_NAME=$(echo ${GITHUB_REF#refs/tags/})
             TAG_NAME=${TAG_NAME#v}
             VERSION=$TAG_NAME
          fi
          echo "SEMANTIC_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        shell: bash
        run: |
          choco install sed make yq -y
          yq -i '.version = strenv(SEMANTIC_VERSION)' pubspec.yaml
      - name: Build Windows Packages
        run: |
          flutter pub get
          flutter config --enable-windows-desktop
          dart pub global activate fastforge
          fastforge release --name onwindows
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: dist/
          retention-days: 1

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    needs: [route, release-validation]
    if: ${{ always() && needs.route.outputs.run_build == 'true' && (needs.release-validation.result == 'success' || needs.release-validation.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y appstream clang cmake desktop-file-utils fakeroot fuse gir1.2-appindicator3-0.1 libappindicator3-1 libappindicator3-dev libarchive-tools libgdk-pixbuf2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libjsoncpp25 libjsoncpp-dev libmpv-dev libnotify-bin libnotify-dev libsecret-1-0 libsecret-1-dev libunwind-dev locate make mpv ninja-build patchelf pkg-config python3-pip python3-setuptools strace tar xmlstarlet
      - name: Install AppImage Tool
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv -v appimagetool /usr/local/bin/
      - name: Set up environment vars
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
             TAG_NAME=$(echo ${GITHUB_REF#refs/tags/})
             TAG_NAME=${TAG_NAME#v}
             VERSION=$TAG_NAME
          fi
          echo "SEMANTIC_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        run: |
          curl -sS https://webi.sh/yq | bash
          ~/.local/bin/yq -i '.version = strenv(SEMANTIC_VERSION)' pubspec.yaml
      - name: Build Linux Packages
        run: |
          flutter pub get
          dart pub global activate fastforge
          fastforge release --name onlinux
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: dist/
          retention-days: 1

  macos:
    name: macOS build
    runs-on: macos-15
    needs: [route, release-validation]
    if: ${{ always() && needs.route.outputs.run_build == 'true' && (needs.release-validation.result == 'success' || needs.release-validation.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - name: Dependencies
        run: |
          python3 -m pip install --break-system-packages setuptools
          npm install --break-system-packages -g appdmg
      - name: Set version environment vars
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
             TAG_NAME=$(echo ${GITHUB_REF#refs/tags/})
             TAG_NAME=${TAG_NAME#v}
             VERSION=$TAG_NAME
          fi
          echo "SEMANTIC_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        run: |
          brew install yq
          yq -i '.version = strenv(SEMANTIC_VERSION)' pubspec.yaml
      - name: Build macOS Packages
        run: |
          flutter pub get
          flutter config --enable-macos-desktop
          dart pub global activate fastforge
          fastforge release --name onmac
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: dist/
          retention-days: 1

  github-release:
    name: Release Publisher
    needs: [route, release-validation, windows, linux, macos]
    if: ${{ needs.route.outputs.run_publisher == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-release
          pattern: '*-release'
          merge-multiple: true

      - name: Create published GitHub release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-test') }}
          generate_release_notes: true
          files: dist-release/**
