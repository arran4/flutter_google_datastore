# Agent rules for generation:
# https://arran4.github.io/blog/post/2026/042-simplified-github-ci-release-safe/
# Release safety details:
# https://arran4.github.io/blog/post/2026/041-release-safe-single-owner-github-ci/
# Built using these posts as reference/guidance.
name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'v*.*.*-rc*'
      - 'v*.*.*-beta*'
      - 'v*.*.*-alpha*'
      - 'v*.*.*-test*'
      - 'test-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "lint-fix"
        type: choice
        options:
          - lint-fix
          - build
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - monthly-maintenance
          - publish-tag
      release_version_override:
        description: "Optional explicit release version, for example 2.4.0 or 2.4.0-rc.2"
        required: false
        default: ""
        type: string
      allow_prs:
        description: "Allow automation to open pull requests"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '17 3 1 * *'
    - cron: '41 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FLUTTER_SDK_VERSION: '3.44.4'

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_build: ${{ steps.route.outputs.run_build }}
      run_release: ${{ steps.route.outputs.run_release }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
      run_post_release: ${{ steps.route.outputs.run_post_release }}
      is_monthly: ${{ steps.route.outputs.is_monthly }}
      is_nightly: ${{ steps.route.outputs.is_nightly }}
    steps:
      - id: route
        shell: bash
        run: |
          set -euo pipefail

          run_code_checks=false
          run_build=false
          run_release=false
          run_cleanup=false
          run_post_release=false
          is_monthly=false
          is_nightly=false

          case "${{ github.event_name }}" in
            push)
              run_code_checks=true
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                run_build=true
                run_release=true
              fi
              ;;

            pull_request)
              if [[ "${{ github.event.action }}" == "closed" ]]; then
                if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
                  run_cleanup=true
                fi
              else
                run_code_checks=true
              fi
              ;;

            workflow_dispatch)
              case "${{ inputs.mode }}" in
                lint-fix)
                  run_code_checks=true
                  is_nightly=true
                  ;;
                build)
                  run_code_checks=true
                  run_build=true
                  ;;
                release-*)
                  run_code_checks=true
                  run_build=false
                  run_release=true
                  ;;
                publish-tag)
                  if [[ "${{ github.ref_type }}" != "tag" || ! "${{ github.ref }}" =~ ^refs/tags/v.* ]]; then
                    echo "publish-tag mode requires an eligible tag context (e.g. refs/tags/v*)" >&2
                    exit 1
                  fi
                  run_code_checks=true
                  run_build=true
                  run_release=true
                  ;;
                monthly-maintenance)
                  run_code_checks=true
                  is_monthly=true
                  ;;
              esac
              ;;

            release)
              run_post_release=true
              ;;

            schedule)
              run_code_checks=true
              if [[ "${{ github.event.schedule }}" == "17 3 1 * *" ]]; then
                is_monthly=true
              else
                is_nightly=true
              fi
              ;;
          esac

          echo "run_code_checks=$run_code_checks" >> "$GITHUB_OUTPUT"
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "run_cleanup=$run_cleanup" >> "$GITHUB_OUTPUT"
          echo "run_post_release=$run_post_release" >> "$GITHUB_OUTPUT"
          echo "is_monthly=$is_monthly" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"

  prepare-release-tag:
    name: Prepare release tag
    needs: [route]
    if: ${{ needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      next_version: ${{ steps.tag.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup git-tag-inc
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'publish-tag' }}
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - id: tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "next_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODE="${{ inputs.mode }}"
          OVERRIDE="${{ inputs.release_version_override }}"

          if [[ "$MODE" == "publish-tag" ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "next_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force

          if [[ -n "$OVERRIDE" ]]; then
            OVERRIDE="${OVERRIDE#v}"
            next_tag="v$OVERRIDE"
          else
            case "$MODE" in
              release-major) level="major"; suffix="" ;;
              release-minor) level="minor"; suffix="" ;;
              release-patch) level="patch"; suffix="" ;;
              release-test)  level="patch"; suffix="test" ;;
              release-rc)    level="patch"; suffix="rc" ;;
              release-alpha) level="patch"; suffix="alpha" ;;
              *) echo "Unsupported release mode: $MODE" >&2; exit 1 ;;
            esac

            args=(-print-version-only "$level")
            [[ -n "$suffix" ]] && args+=("$suffix")

            # Using git-tag-inc, or fallback
            if command -v git-tag-inc >/dev/null 2>&1; then
                next_tag=$(git-tag-inc "${args[@]}")
            else
                latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)
                [[ -z "$latest" ]] && latest='0.0.0'
                base="${latest%%-*}"
                IFS='.' read -r maj min pat <<< "$base"
                case "$level" in
                  major) maj=$((maj+1)); min=0; pat=0 ;;
                  minor) min=$((min+1)); pat=0 ;;
                  *) pat=$((pat+1)) ;;
                esac
                next_tag="v${maj}.${min}.${pat}"
                if [[ -n "$suffix" ]]; then
                  next_tag="${next_tag}-${suffix}.1"
                fi
            fi
          fi

          [[ "$next_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || {
            echo "Invalid tag: $next_tag" >&2
            exit 1
          }

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$next_tag" | awk '{print $1}')
            if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
              echo "Tag $next_tag exists and points to GITHUB_SHA. Safe to retry."
            else
              echo "Tag already exists and points to $REMOTE_TAG_SHA (expected ${GITHUB_SHA}): $next_tag" >&2
              echo "To retry a failed publication for this exact version, ensure release_version_override is used and GITHUB_SHA matches." >&2
              exit 1
            fi
          fi

          echo "release_tag=$next_tag" >> "$GITHUB_OUTPUT"

          clean_tag="${next_tag#v}"
          clean_tag="${clean_tag%%-*}"
          IFS='.' read -r maj min pat <<< "$clean_tag"
          echo "next_version=${maj:-0}.${min:-0}.$(( ${pat:-0} + 1 ))-SNAPSHOT" >> "$GITHUB_OUTPUT"

  discover:
    name: Discover capabilities
    needs: [route]
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_dart: ${{ steps.detect.outputs.has_dart }}
      has_flutter: ${{ steps.detect.outputs.has_flutter }}
      has_qt_cpp: ${{ steps.detect.outputs.has_qt_cpp }}
      has_make_c: ${{ steps.detect.outputs.has_make_c }}
      has_docker: ${{ steps.detect.outputs.has_docker }}
      has_goreleaser: ${{ steps.detect.outputs.has_goreleaser }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          [[ -f go.mod ]] && echo "has_go=true" >> "$GITHUB_OUTPUT" || echo "has_go=false" >> "$GITHUB_OUTPUT"
          [[ -f package.json ]] && echo "has_node=true" >> "$GITHUB_OUTPUT" || echo "has_node=false" >> "$GITHUB_OUTPUT"
          [[ -f pubspec.yaml ]] && echo "has_dart=true" >> "$GITHUB_OUTPUT" || echo "has_dart=false" >> "$GITHUB_OUTPUT"
          if [[ -f pubspec.yaml ]] && grep -q '^  flutter:' pubspec.yaml; then
            echo "has_flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flutter=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f CMakeLists.txt ]] && grep -qiE 'Qt|KF[56]|ECM' CMakeLists.txt; then
            echo "has_qt_cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_qt_cpp=false" >> "$GITHUB_OUTPUT"
          fi
          [[ -f Makefile || -f makefile ]] && echo "has_make_c=true" >> "$GITHUB_OUTPUT" || echo "has_make_c=false" >> "$GITHUB_OUTPUT"
          [[ -f Dockerfile || -f docker-compose.yml || -f compose.yml ]] && echo "has_docker=true" >> "$GITHUB_OUTPUT" || echo "has_docker=false" >> "$GITHUB_OUTPUT"
          if [[ -f .goreleaser.yml || -f .goreleaser.yaml || -f goreleaser.yml || -f goreleaser.yaml ]]; then
            echo "has_goreleaser=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_goreleaser=false" >> "$GITHUB_OUTPUT"
          fi
      - id: profile
        shell: bash
        run: |
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            echo "profile=private" >> "$GITHUB_OUTPUT"
          else
            echo "profile=public" >> "$GITHUB_OUTPUT"
          fi

  flutter-analyze-test:
    name: Flutter analyze/test (fast path)
    needs: [route, discover]
    if: ${{ needs.discover.outputs.has_flutter == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos || true
      - run: flutter test --no-pub

  release-validation:
    name: Release Validation Gate
    needs: [route, discover, flutter-analyze-test]
    if: |
      !failure() && !cancelled() &&
      (needs.route.outputs.run_release == 'true' || needs.route.outputs.run_build == 'true') &&
      needs.route.result == 'success' &&
      needs.discover.result == 'success' &&
      (needs.discover.outputs.has_flutter != 'true' || needs.flutter-analyze-test.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required language checks passed."

  release-context:
    name: Release Context
    needs: [route, prepare-release-tag, release-validation]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_tag: ${{ steps.export.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and push tag
        id: export
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare-release-tag.outputs.release_tag }}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "publish-tag" ]]; then
            if [[ "${{ github.ref_type }}" != "tag" ]]; then
              echo "Error: publish-tag mode invoked on a non-tag ref." >&2
              exit 1
            fi
            echo "Running in internal publisher mode; tag is immutable context."
            exit 0
          fi

          git fetch --tags --force
          REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')

          if [[ -n "$REMOTE_TAG_SHA" ]]; then
            if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
              echo "Tag $TAG already exists on remote and points to the correct SHA. Continuing safely."
            else
              echo "Tag $TAG already exists on remote but points to a different commit ($REMOTE_TAG_SHA). Failing." >&2
              exit 1
            fi
          else
            git tag "$TAG" "${GITHUB_SHA}"
            git push origin "$TAG" || (
              VERIFY_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
              if [[ "$VERIFY_SHA" == "${GITHUB_SHA}" ]]; then
                echo "Tag successfully verified on remote after push error."
              else
                echo "Tag push failed and remote verification failed." >&2
                exit 1
              fi
            )
          fi

          # Explicitly dispatch the publisher workflow at the new tag ref
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            gh workflow run "ci.yml" --ref "$TAG" -f mode="publish-tag"
          fi

  autofix:
    name: Auto-format and open PR
    needs: [route, discover]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'lint-fix' && inputs.allow_prs == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dart/Flutter (if needed)
        if: ${{ needs.discover.outputs.has_dart == 'true' || needs.discover.outputs.has_flutter == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Run autofix formatters
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.discover.outputs.has_dart }}" == "true" || "${{ needs.discover.outputs.has_flutter }}" == "true" ]]; then
            dart format . || true
          fi
      - name: Create PR if changes exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes; exiting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PARENT_PR="${{ github.event.pull_request.number || 'none' }}"
          BRANCH="ci/autofix/${{ github.run_id }}-parent-${PARENT_PR}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "ci: automated formatting fixes"
          git push origin "$BRANCH"
          gh pr create --title "ci: automated formatting fixes" --body "Automated formatting pass. Parent-PR: ${PARENT_PR}" --base main --head "$BRANCH" --label "ci-autofix"

  cleanup-autofix-prs:
    name: Cleanup autofix PRs on parent close
    needs: [route]
    if: ${{ needs.route.outputs.run_cleanup == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr list --state open --search "label:ci-autofix in:title" --json number,headRefName,body | \
            jq -r '.[] | select(.body | contains("Parent-PR: '"$PARENT_PR"'")) | [.number, .headRefName] | @tsv' | \
            while IFS=$'\t' read -r pr branch; do
              gh pr close "$pr" --comment "Closing auto-fix PR because parent PR #$PARENT_PR was closed."
              git push origin --delete "$branch" || true
            done

  windows:
    name: Windows build and release
    runs-on: windows-latest
    needs: [route, discover, prepare-release-tag, release-validation]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_build == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - name: Set up environment vars
        shell: bash
        run: |
          if [[ "${{ needs.route.outputs.run_release }}" == "true" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ needs.prepare-release-tag.outputs.release_tag }}" ]]; then
              TAG_NAME="${{ needs.prepare-release-tag.outputs.release_tag }}"
            else
              TAG_NAME=$(echo ${GITHUB_REF#refs/tags/})
            fi
            TAG_NAME=${TAG_NAME#v}
            echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
            echo "FLUTTER_VERSION=$TAG_NAME" >> $GITHUB_ENV
            echo "FLUTTER_APP_VERSION=$TAG_NAME" >> $GITHUB_ENV
          else
            # For non-release builds, just extract the version natively from pubspec.yaml instead of assuming a tag exists
            VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
            echo "SEMANTIC_VERSION=$VERSION" >> $GITHUB_ENV
            echo "FLUTTER_VERSION=$VERSION" >> $GITHUB_ENV
            echo "FLUTTER_APP_VERSION=$VERSION" >> $GITHUB_ENV
          fi
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        shell: bash
        run: |
          choco install sed make yq -y
          yq -i '.version = strenv(SEMANTIC_VERSION)' pubspec.yaml
      - name: Build Windows Packages
        run: |
          flutter pub get
          flutter config --enable-windows-desktop
          dart pub global activate fastforge
          fastforge release --name onwindows
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/
          retention-days: 3

  linux:
    name: Linux build and release
    runs-on: ubuntu-latest
    needs: [route, discover, prepare-release-tag, release-validation]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_build == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y appstream clang cmake desktop-file-utils fakeroot fuse gir1.2-appindicator3-0.1 libappindicator3-1 libappindicator3-dev libarchive-tools libgdk-pixbuf2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libjsoncpp25 libjsoncpp-dev libmpv-dev libnotify-bin libnotify-dev libsecret-1-0 libsecret-1-dev libunwind-dev locate make mpv ninja-build patchelf pkg-config python3-pip python3-setuptools strace tar xmlstarlet
      - name: Install AppImage Tool
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv -v appimagetool /usr/local/bin/
      - name: Set up environment vars
        shell: bash
        run: |
          if [[ "${{ needs.route.outputs.run_release }}" == "true" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ needs.prepare-release-tag.outputs.release_tag }}" ]]; then
              TAG_NAME="${{ needs.prepare-release-tag.outputs.release_tag }}"
            else
              TAG_NAME=$(echo ${GITHUB_REF#refs/tags/})
            fi
            TAG_NAME=${TAG_NAME#v}
            echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
            echo "FLUTTER_VERSION=$TAG_NAME" >> $GITHUB_ENV
            echo "FLUTTER_APP_VERSION=$TAG_NAME" >> $GITHUB_ENV
          else
            # For non-release builds, just extract the version natively from pubspec.yaml instead of assuming a tag exists
            VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
            echo "SEMANTIC_VERSION=$VERSION" >> $GITHUB_ENV
            echo "FLUTTER_VERSION=$VERSION" >> $GITHUB_ENV
            echo "FLUTTER_APP_VERSION=$VERSION" >> $GITHUB_ENV
          fi
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        run: |
          curl -sS https://webi.sh/yq | sh
          ~/.local/bin/yq -i '.version = strenv(SEMANTIC_VERSION)' pubspec.yaml
      - name: Build Linux Packages
        run: |
          flutter pub get
          dart pub global activate fastforge
          fastforge release --name onlinux
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/
          retention-days: 3

  macos:
    name: macOS build and release
    runs-on: macos-15
    needs: [route, discover, prepare-release-tag, release-validation]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_build == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - name: Dependencies
        run: |
          python3 -m pip install --break-system-packages setuptools
          npm install --break-system-packages -g appdmg
      - name: Set version environment vars
        shell: bash
        run: |
          if [[ "${{ needs.route.outputs.run_release }}" == "true" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ needs.prepare-release-tag.outputs.release_tag }}" ]]; then
              TAG_NAME="${{ needs.prepare-release-tag.outputs.release_tag }}"
            else
              TAG_NAME=$(echo ${GITHUB_REF#refs/tags/})
            fi
            TAG_NAME=${TAG_NAME#v}
            echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
            echo "FLUTTER_VERSION=$TAG_NAME" >> $GITHUB_ENV
            echo "FLUTTER_APP_VERSION=$TAG_NAME" >> $GITHUB_ENV
          else
            # For non-release builds, just extract the version natively from pubspec.yaml instead of assuming a tag exists
            VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
            echo "SEMANTIC_VERSION=$VERSION" >> $GITHUB_ENV
            echo "FLUTTER_VERSION=$VERSION" >> $GITHUB_ENV
            echo "FLUTTER_APP_VERSION=$VERSION" >> $GITHUB_ENV
          fi
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        run: |
          brew install yq
          yq -i '.version = strenv(SEMANTIC_VERSION)' pubspec.yaml
      - name: Build macOS Packages
        run: |
          flutter pub get
          flutter config --enable-macos-desktop
          dart pub global activate fastforge
          fastforge release --name onmac
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/
          retention-days: 3

  github-release:
    name: Publish GitHub release
    needs: [route, discover, release-context, windows, linux, macos]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_release == 'true' && needs.discover.outputs.has_goreleaser != 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          pattern: '*-release'
          merge-multiple: true

      - name: Create published GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ needs.release-context.outputs.release_tag }}
          prerelease: ${{ contains(needs.release-context.outputs.release_tag, '-rc') || contains(needs.release-context.outputs.release_tag, '-alpha') || contains(needs.release-context.outputs.release_tag, '-beta') || contains(needs.release-context.outputs.release_tag, '-test') }}
          generate_release_notes: true
          files: dist-release/**
