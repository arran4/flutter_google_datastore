# Canonical GitHub Actions CI/CD Super-Reference (043)
# https://arran4.github.io/blog/post/2026/043-canonical-github-actions-ci-cd-super-reference/
name: CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "build"
        type: choice
        options:
          - build
          - lint-fix
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - monthly-maintenance
          - publish-tag
      release_version_override:
        description: "Optional explicit release version, for example 2.4.0 or 2.4.0-rc.2"
        required: false
        default: ""
        type: string
      allow_prs:
        description: "Create PR"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 1 * *'
    - cron: '41 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.inputs.mode, 'release-') }}

permissions:
  contents: read
  pull-requests: read

env:
  FLUTTER_SDK_VERSION: '3.44.4'

jobs:
  route:
    name: Route Event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_build: ${{ steps.route.outputs.run_build }}
      run_release: ${{ steps.route.outputs.run_release }}
      run_autofix: ${{ steps.route.outputs.run_autofix }}
      run_publisher: ${{ steps.route.outputs.run_publisher }}
      run_maintenance: ${{ steps.route.outputs.run_maintenance }}
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          bash ./scripts/route_policy.sh "$EVENT_NAME" "$REF_TYPE" "$GITHUB_REF" "$INPUT_MODE" "$SCHEDULE" >> "$GITHUB_OUTPUT"

  policy-test:
    name: Test Release Policy
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install git-tag-inc
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - name: Test Policy Helper
        run: |
          set -euo pipefail

          # Setup local dummy repo to act as origin
          TMP_DIR=$(mktemp -d)
          mkdir -p $TMP_DIR/dummy_origin
          cd $TMP_DIR/dummy_origin
          git init --bare
          cd -

          # Setup local repo
          mkdir -p $TMP_DIR/dummy_local
          cd $TMP_DIR/dummy_local
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          git remote add origin $TMP_DIR/dummy_origin

          # Create main branch and initial commit
          touch test.txt
          git add test.txt
          git commit -m "initial"
          git branch -M main
          git push -u origin main
          MAIN_SHA=$(git rev-parse HEAD)

          # We need a stale SHA
          echo "stale" > test.txt
          git add test.txt
          git commit -m "stale"
          git push origin main
          NEW_MAIN_SHA=$(git rev-parse HEAD)

          # Link the script
          mkdir -p scripts
          cp $GITHUB_WORKSPACE/scripts/release_policy.sh scripts/

          echo "Testing verify_main_sha"
          # Valid
          ./scripts/release_policy.sh verify_main_sha "main" "$NEW_MAIN_SHA"
          # Invalid branch
          ! ./scripts/release_policy.sh verify_main_sha "master" "$NEW_MAIN_SHA" || exit 1
          # Wrong SHA (stale)
          ! ./scripts/release_policy.sh verify_main_sha "main" "$MAIN_SHA" || exit 1

          echo "Testing calculate_tag"
          TAG=$(./scripts/release_policy.sh calculate_tag "v1.2.3" "release-major")
          if [[ "$TAG" != "v1.2.3" ]]; then echo "Fail"; exit 1; fi
          # Test malformed override
          ! ./scripts/release_policy.sh calculate_tag "v1.x.y" "release-major" || exit 1
          # Test shell metacharacters
          ! ./scripts/release_policy.sh calculate_tag "v1.0.0; rm -rf /" "release-major" || exit 1

          # To test git-tag-inc, we need it installed in path. Let's assume it works or skip it since we only pass mode.

          echo "Testing idempotent_push"
          # New tag push
          ./scripts/release_policy.sh idempotent_push "v0.0.1" "$NEW_MAIN_SHA"
          # Existing correct tag
          ./scripts/release_policy.sh idempotent_push "v0.0.1" "$NEW_MAIN_SHA"
          # Existing wrong-SHA tag
          ! ./scripts/release_policy.sh idempotent_push "v0.0.1" "$MAIN_SHA" || exit 1

          # Annotated tag dereference
          git tag -a "v0.0.2" -m "annotated" "$NEW_MAIN_SHA"
          git push origin "v0.0.2"
          ./scripts/release_policy.sh idempotent_push "v0.0.2" "$NEW_MAIN_SHA"

          # Race/main-advanced rejection
          echo "race" > test.txt
          git add test.txt
          git commit -m "race"
          git push origin main
          RACE_SHA=$(git rev-parse HEAD)
          # We try to push a new tag v0.0.3 using NEW_MAIN_SHA, but main is at RACE_SHA
          ! ./scripts/release_policy.sh idempotent_push "v0.0.3" "$NEW_MAIN_SHA" || exit 1


          echo "Testing route_policy.sh"
          # PR validation
          OUT=$(bash $GITHUB_WORKSPACE/scripts/route_policy.sh "pull_request" "" "refs/pull/1/merge" "" "")
          [[ "$OUT" =~ "run_code_checks=true" ]] || exit 1

          # Normal build
          OUT=$(bash $GITHUB_WORKSPACE/scripts/route_policy.sh "workflow_dispatch" "branch" "refs/heads/main" "build" "")
          [[ "$OUT" =~ "run_build=true" ]] || exit 1

          # release-*
          OUT=$(bash $GITHUB_WORKSPACE/scripts/route_policy.sh "workflow_dispatch" "branch" "refs/heads/main" "release-minor" "")
          [[ "$OUT" =~ "run_release=true" ]] && [[ "$OUT" =~ "run_build=true" ]] || exit 1

          # valid publish-tag context
          OUT=$(bash $GITHUB_WORKSPACE/scripts/route_policy.sh "workflow_dispatch" "tag" "refs/tags/v1.0.0" "publish-tag" "")
          [[ "$OUT" =~ "run_build=true" ]] && [[ "$OUT" =~ "run_publisher=true" ]] && [[ "$OUT" =~ "run_release=false" ]] || exit 1

          # invalid publish-tag context
          ! bash $GITHUB_WORKSPACE/scripts/route_policy.sh "workflow_dispatch" "branch" "refs/heads/main" "publish-tag" "" || exit 1

          # scheduled maintenance
          OUT=$(bash $GITHUB_WORKSPACE/scripts/route_policy.sh "schedule" "" "" "" "17 3 1 * *")
          [[ "$OUT" =~ "run_maintenance=true" ]] || exit 1



                    # scheduled nightly autofix
          OUT=$(bash $GITHUB_WORKSPACE/scripts/route_policy.sh "schedule" "" "" "" "41 2 * * *")
          [[ "$OUT" =~ "run_autofix=true" ]] && [[ ! "$OUT" =~ "run_maintenance=true" ]] || exit 1

          # v* tag push
          OUT=$(bash $GITHUB_WORKSPACE/scripts/route_policy.sh "push" "tag" "refs/tags/v1.0.0" "" "")
          [[ "$OUT" =~ "run_publisher=true" ]] || exit 1
          # Check that publisher depends on all 3 builds and route
          if ! grep -q 'needs: \[route, release-validation, windows, linux, macos\]' $GITHUB_WORKSPACE/.github/workflows/ci.yml; then
              echo "Error: github-release publisher does not depend on route, release-validation, windows, linux, macos"
              exit 1
          fi
          # Check exact single explicit dispatch
          DISPATCH_COUNT=$(grep -E -c '^[[:space:]]+run: gh workflow run ci\.yml --ref \"\$TAG\" -f mode=publish-tag$' $GITHUB_WORKSPACE/.github/workflows/ci.yml || true)
          if [[ "$DISPATCH_COUNT" != "1" ]]; then
              echo "Error: Expected exactly 1 dispatch, got $DISPATCH_COUNT"
              exit 1
          fi
# check ci.yml for PR gating policy
          echo "Testing ci.yml PR gating conditions"
          python3 -c "
import yaml
with open('$GITHUB_WORKSPACE/.github/workflows/ci.yml') as f:
    ci = yaml.safe_load(f)
assert ci[True]['workflow_dispatch']['inputs']['allow_prs']['default'] == False, 'allow_prs default must be false'

maintenance = [j for name, j in ci['jobs'].items() if 'monthly-maintenance' in str(j) or 'maintenance' in name][0]['steps']
dry_run = [s for s in maintenance if 'name' in s and 'Check outdated dependencies (dry run)' in s['name']][0]
upgrade = [s for s in maintenance if 'name' in s and 'Upgrade dependencies' in s['name']][0]
pr = [s for s in maintenance if 'uses' in s and 'create-pull-request' in s['uses']][0]

assert dry_run['if'] == r\"\"\"\${{ !(github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'monthly-maintenance') }}\"\"\", 'dry run missing neg gating'
assert upgrade['if'] == r\"\"\"\${{ github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'monthly-maintenance' }}\"\"\", 'upgrade missing explicit gating'
assert pr['if'] == r\"\"\"\${{ github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'monthly-maintenance' }}\"\"\", 'pr missing explicit gating'

autofix = ci['jobs']['autofix']['steps']
dry_run = [s for s in autofix if 'name' in s and 'Check formatting drift (dry run)' in s['name']][0]
fmt = [s for s in autofix if 'name' in s and 'Apply formatting' in s['name']][0]
pr = [s for s in autofix if 'uses' in s and 'create-pull-request' in s['uses']][0]

assert dry_run['if'] == r\"\"\"\${{ !(github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'lint-fix') }}\"\"\", 'dry run missing neg gating'
assert fmt['if'] == r\"\"\"\${{ github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'lint-fix' }}\"\"\", 'fmt missing explicit gating'
assert pr['if'] == r\"\"\"\${{ github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'lint-fix' }}\"\"\", 'pr missing explicit gating'
"
          echo "All policy tests passed!"



  flutter-analyze-test:
    name: Flutter Analyze & Test
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  release-validation:
    name: Release Quality Gates Passed
    needs: [route, flutter-analyze-test, policy-test]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - run: echo "All release quality gates passed."

  maintenance:
    name: Monthly Maintenance
    needs: [route]
    if: ${{ needs.route.outputs.run_maintenance == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - name: Check outdated dependencies (dry run)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'monthly-maintenance') }}
        run: flutter pub outdated
      - name: Upgrade dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'monthly-maintenance' }}
        run: flutter pub upgrade --major-versions
      - name: Create Pull Request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'monthly-maintenance' }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: monthly dependency update"
          title: "chore: monthly dependency update"
          branch: automation/maintenance
          delete-branch: true

  autofix:
    name: Autofix Formatting
    needs: [route]
    if: ${{ needs.route.outputs.run_autofix == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - run: flutter pub get
      - name: Check formatting drift (dry run)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'lint-fix') }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Apply formatting
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'lint-fix' }}
        run: dart format .
      - name: Create Pull Request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_prs == true && inputs.mode == 'lint-fix' }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "style: auto-format code and lint fixes"
          title: "style: auto-format code and lint fixes"
          branch: automation/lint-fix
          delete-branch: true

  prepare-release-tag:
    name: Prepare Release Tag
    needs: [route, release-validation, windows, linux, macos]
    if: ${{ needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_tag: ${{ steps.tagger.outputs.TAG }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install git-tag-inc
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - name: Verify Exact Origin/Main
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/release_policy.sh verify_main_sha "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Calculate or explicitly set version
        id: tagger
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version_override }}
        run: |
          TAG=$(./scripts/release_policy.sh calculate_tag "$RELEASE_VERSION_OVERRIDE" "$RELEASE_MODE")
          echo "Calculated TAG=$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
      - name: Tag and push (Idempotent)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/release_policy.sh idempotent_push "$TAG" "$GITHUB_SHA"


      - name: Dispatch Publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "$TAG" -f mode=publish-tag

  windows:
    name: Windows build
    runs-on: windows-latest
    needs: [route, release-validation]
    if: ${{ always() && needs.route.outputs.run_build == 'true' && (needs.release-validation.result == 'success' || needs.release-validation.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - name: Set up environment vars
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
             TAG_NAME=$(echo ${GITHUB_REF#refs/tags/})
             TAG_NAME=${TAG_NAME#v}
             VERSION=$TAG_NAME
          fi
          echo "SEMANTIC_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        shell: bash
        run: |
          choco install sed make yq -y
          yq -i '.version = strenv(SEMANTIC_VERSION)' pubspec.yaml
      - name: Build Windows Packages
        run: |
          flutter pub get
          flutter config --enable-windows-desktop
          dart pub global activate fastforge
          fastforge release --name onwindows
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: dist/
          retention-days: 1

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    needs: [route, release-validation]
    if: ${{ always() && needs.route.outputs.run_build == 'true' && (needs.release-validation.result == 'success' || needs.release-validation.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y appstream clang cmake desktop-file-utils fakeroot fuse gir1.2-appindicator3-0.1 libappindicator3-1 libappindicator3-dev libarchive-tools libgdk-pixbuf2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libjsoncpp25 libjsoncpp-dev libmpv-dev libnotify-bin libnotify-dev libsecret-1-0 libsecret-1-dev libunwind-dev locate make mpv ninja-build patchelf pkg-config python3-pip python3-setuptools strace tar xmlstarlet
      - name: Install AppImage Tool
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv -v appimagetool /usr/local/bin/
      - name: Set up environment vars
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
             TAG_NAME=$(echo ${GITHUB_REF#refs/tags/})
             TAG_NAME=${TAG_NAME#v}
             VERSION=$TAG_NAME
          fi
          echo "SEMANTIC_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        run: |
          curl -sS https://webi.sh/yq | bash
          ~/.local/bin/yq -i '.version = strenv(SEMANTIC_VERSION)' pubspec.yaml
      - name: Build Linux Packages
        run: |
          flutter pub get
          dart pub global activate fastforge
          fastforge release --name onlinux
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: dist/
          retention-days: 1

  macos:
    name: macOS build
    runs-on: macos-15
    needs: [route, release-validation]
    if: ${{ always() && needs.route.outputs.run_build == 'true' && (needs.release-validation.result == 'success' || needs.release-validation.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
      - name: Dependencies
        run: |
          python3 -m pip install --break-system-packages setuptools
          npm install --break-system-packages -g appdmg
      - name: Set version environment vars
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
             TAG_NAME=$(echo ${GITHUB_REF#refs/tags/})
             TAG_NAME=${TAG_NAME#v}
             VERSION=$TAG_NAME
          fi
          echo "SEMANTIC_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLUTTER_APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        run: |
          brew install yq
          yq -i '.version = strenv(SEMANTIC_VERSION)' pubspec.yaml
      - name: Build macOS Packages
        run: |
          flutter pub get
          flutter config --enable-macos-desktop
          dart pub global activate fastforge
          fastforge release --name onmac
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: dist/
          retention-days: 1

  github-release:
    name: Release Publisher
    needs: [route, release-validation, windows, linux, macos]
    if: ${{ needs.route.outputs.run_publisher == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-release
          pattern: '*-release'
          merge-multiple: true

      - name: Create published GitHub release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-test') }}
          generate_release_notes: true
          files: dist-release/**
