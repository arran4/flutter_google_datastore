name: flutter_google_datastore
description: A flutter project to browse a google datastore
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.6
  sqflite_common_ffi_web: ^1.2.2
  ulid4d: ^2.0.0
  settings_ui: ^3.0.1
  googleapis: ^18.0.0
  path_provider: ^2.1.5
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  google_sign_in: ^7.2.0
  google_sign_in_android: ^7.2.18
  google_sign_in_ios: ^6.4.0
  google_sign_in_platform_interface: ^3.1.0
  google_sign_in_web: ^1.1.0
  googleapis_auth: ^2.3.7
  toml: ^0.18.0
  ini: ^2.1.0
  infinite_scroll_pagination: ^5.0.0
  timezone: ^0.11.2
  file_picker: ^13.3.2
  dartobjectutils: ^0.1.1
  path: ^1.9.1
  http: ^1.6.0
  xdg_directories: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/logo.png
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  # optionally, as transparency is not allowed on app store
  # remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
