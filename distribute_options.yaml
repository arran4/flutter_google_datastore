output: dist/
releases:
  - name: onlinux
    jobs:
      - name: linux-appimage
        package:
          platform: linux
          target: appimage
      - name: linux-deb
        package:
          platform: linux
          target: deb
      - name: linux-rpm
        package:
          platform: linux
          target: rpm
      - name: linux-pacman
        package:
          platform: linux
          target: pacman
      - name: linux-zip
        package:
          platform: linux
          target: zip
      - name: android-aab
        package:
          platform: android
          target: aab
          build_args:
            target-platform: android-arm,android-arm64
      - name: android-apk
        package:
          platform: android
          target: apk
          build_args:
            target-platform: android-arm,android-arm64
      - name: web-zip
        package:
          platform: web
          target: zip
  - name: onwindows
    jobs:
      - name: windows-exe
        package:
          platform: windows
          target: exe
      - name: windows-msix
        package:
          platform: windows
          target: msix
      - name: windows-zip
        package:
          platform: windows
          target: zip
  - name: onmac
    jobs:
